name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install uv
        run: pip install uv==0.12.13
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check app tests
      - name: Test
        run: uv run pytest
