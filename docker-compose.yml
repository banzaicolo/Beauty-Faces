services:
  app:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    init: true
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - beauty-faces-data:/app/data
    environment:
      DATA_DIR: /app/data
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO: ${SEED_DEMO:-1}
      APP_PROFILE: ${APP_PROFILE:-skin_care}
      TEXT_PROVIDER: ${TEXT_PROVIDER:?Set TEXT_PROVIDER in .env}
      TEXT_MODEL: ${TEXT_MODEL:-}
      TEXT_BASE_URL: ${TEXT_BASE_URL:-}
      TEXT_API_KEY: ${TEXT_API_KEY:-}
      TEXT_PROVIDER_FACTORY: ${TEXT_PROVIDER_FACTORY:-}
      TEXT_TEMPERATURE: ${TEXT_TEMPERATURE:-0.6}
      TEXT_MAX_TOKENS: ${TEXT_MAX_TOKENS:-}
      TEXT_TIMEOUT_SECONDS: ${TEXT_TIMEOUT_SECONDS:-180}
      TEXT_HEADERS_JSON: ${TEXT_HEADERS_JSON:-{}}
      TEXT_EXTRA_BODY_JSON: ${TEXT_EXTRA_BODY_JSON:-{}}
      TEXT_TOOL_CALLING: ${TEXT_TOOL_CALLING:-true}
      TEXT_PRIVACY_MODE: ${TEXT_PRIVACY_MODE:-unknown}
      VISION_PROVIDER: ${VISION_PROVIDER:?Set VISION_PROVIDER in .env}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_ENDPOINT: ${VISION_ENDPOINT:-}
      VISION_PROVIDER_FACTORY: ${VISION_PROVIDER_FACTORY:-}
      VISION_TEMPERATURE: ${VISION_TEMPERATURE:-0.3}
      VISION_MAX_TOKENS: ${VISION_MAX_TOKENS:-}
      VISION_STREAM: ${VISION_STREAM:-true}
      VISION_TIMEOUT_SECONDS: ${VISION_TIMEOUT_SECONDS:-300}
      VISION_HEADERS_JSON: ${VISION_HEADERS_JSON:-{}}
      VISION_EXTRA_BODY_JSON: ${VISION_EXTRA_BODY_JSON:-{}}
      VISION_PRIVACY_MODE: ${VISION_PRIVACY_MODE:-unknown}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  beauty-faces-data:
